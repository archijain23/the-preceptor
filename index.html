<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Favicon ─────────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ── Primary Meta ─────────────────────────────────────────── -->
    <title>The Preceptor — Vedic Astrology Readings &amp; Spiritual Consultations Online</title>
    <meta
      name="description"
      content="Book a private Vedic astrology consultation online with The Preceptor — 7 years of experience, Psychology honors graduate. Birth chart readings, career &amp; relationship clarity for seekers across the USA."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://thepreceptorglobal.com/" />

    <!-- ── Theme color (PWA + browser chrome) ─────────────────────── -->
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translacent" />

    <!-- ── Open Graph — static pre-hydration fallback ─────────────────
         Social crawlers (FB, LinkedIn, WhatsApp, Slack, Discord)
         do NOT run JavaScript. These tags are read from raw HTML.
         react-helmet-async per-page <SEO> tags override these at
         runtime for real users visiting any specific page.
    ──────────────────────────────────────────────────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://thepreceptorglobal.com/" />
    <meta property="og:site_name"   content="The Preceptor" />
    <meta property="og:locale"      content="en_US" />
    <meta
      property="og:title"
      content="The Preceptor — Vedic Astrology Readings &amp; Spiritual Consultations Online"
    />
    <meta
      property="og:description"
      content="Book a private Vedic astrology consultation online with The Preceptor — 7 years of experience, Psychology honors graduate. Birth chart readings, career &amp; relationship clarity for seekers across the USA."
    />
    <meta property="og:image"        content="https://thepreceptorglobal.com/og-image.webp" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"    content="The Preceptor — For those who seek clarity." />
    <meta property="og:image:type"   content="image/webp" />

    <!-- ── Twitter / X Card — static pre-hydration fallback ─────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@thepreceptorglobal" />
    <meta
      name="twitter:title"
      content="The Preceptor — Vedic Astrology Readings &amp; Spiritual Consultations Online"
    />
    <meta
      name="twitter:description"
      content="Book a private Vedic astrology consultation online with The Preceptor — 7 years of experience, Psychology honors graduate. Birth chart readings, career &amp; relationship clarity for seekers across the USA."
    />
    <meta name="twitter:image"       content="https://thepreceptorglobal.com/og-image.webp" />
    <meta name="twitter:image:alt"   content="The Preceptor — For those who seek clarity." />

    <!-- ── Google Fonts — preconnect + non-render-blocking load ─────────
         FIX 6: Only preconnect to origins we actually use during load.
         The cdn.sanity.io preconnect has been removed — it was flagged
         as unused by Lighthouse (FIX 7).

         FIX 4 (render-blocking CSS): The Google Fonts stylesheet is loaded
         non-blocking via rel="preload" + onload swap, then a <noscript>
         fallback ensures fonts load even if JS is disabled.
         This removes the 300ms render-blocking penalty on FCP.
    ──────────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Non-blocking font load: preload triggers early fetch without blocking render -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400&family=Inter:wght@200;300;400;500;600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <!-- Fallback for no-JS environments -->
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400&family=Inter:wght@200;300;400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
